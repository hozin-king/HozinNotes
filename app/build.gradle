plugins {
    id("com.android.application")
}

// google-services.json is optional: chat/Drive features degrade gracefully without it.
if (file("google-services.json").exists()) {
    apply(plugin = "com.google.gms.google-services")
}

android {
    namespace = "com.hozinking.notes"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.hozinking.notes"
        minSdk = 26
        targetSdk = 34
        versionCode = 17
        versionName = "1.14"
        // 64-bit only: native lib (SQLCipher) cuma arm64-v8a (arsitektur HP user).
        ndk {
            abiFilters += "arm64-v8a"
        }
    }

    // Release signing memakai keystore stabil dari CI secrets
    // (HOZIN_KEYSTORE_PATH dkk). Tanpa itu -> fallback ke debug agar build lokal tetap jalan.
    def keystorePath = System.getenv("HOZIN_KEYSTORE_PATH")
    signingConfigs {
        create("release") {
            if (keystorePath) {
                storeFile = file(keystorePath)
                storePassword = System.getenv("HOZIN_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("HOZIN_KEY_ALIAS") ?: "hozin"
                keyPassword = System.getenv("HOZIN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName(keystorePath ? "release" : "debug")
            // R8: kecilkan APK (class + resource yang tak terpakai dibuang).
            // Keep rules ada di proguard-rules.pro (Room, Drive API, dsb).
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging {
        resources {
            pickFirsts.add("META-INF/DEPENDENCIES")
            pickFirsts.add("META-INF/LICENSE*")
            pickFirsts.add("META-INF/NOTICE*")
            excludes.add("META-INF/*.kotlin_module")
        }
    }
}

dependencies {
    // AndroidX core
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.core:core:1.13.1")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation("androidx.viewpager2:viewpager2:1.0.0")
    implementation("androidx.lifecycle:lifecycle-runtime:2.7.0")
    implementation("androidx.biometric:biometric:1.1.0")
    implementation("androidx.security:security-crypto:1.1.0-alpha06")

    // Room (SQLite + FTS4)
    def roomVersion = "2.6.1"
    implementation("androidx.room:room-runtime:$roomVersion")
    implementation("androidx.room:room-paging:$roomVersion")
    annotationProcessor("androidx.room:room-compiler:$roomVersion")

    // Paging 3
    implementation("androidx.paging:paging-runtime:3.3.0")

    // SQLCipher (encrypted vault database)
    implementation("net.zetetic:android-database-sqlcipher:4.5.4")

    // Image loading (memory + disk cache)
    implementation("io.coil-kt:coil:2.5.0")

    // Background backup scheduling
    implementation("androidx.work:work-runtime:2.9.0")

    // Google Sign-In (Drive backup)
    implementation("com.google.android.gms:play-services-auth:21.2.0")

    // Drive API v3 (REST, guarded at runtime)
    implementation("com.google.apis:google-api-services-drive:v3-rev20240123-2.0.0") {
        exclude group: "org.apache.httpcomponents"
    }
    implementation("com.google.api-client:google-api-client-android:2.2.0") {
        exclude group: "org.apache.httpcomponents"
    }

}
