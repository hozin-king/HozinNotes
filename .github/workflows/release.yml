name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Siapkan keystore rilis (dari secrets)
      run: |
        echo "$HOZIN_KEYSTORE_BASE64" | base64 -d > /tmp/hozin-release.jks
        echo "== Fingerprint sertifikat rilis =="
        keytool -list -v -keystore /tmp/hozin-release.jks \
          -alias "$HOZIN_KEY_ALIAS" -storepass "$HOZIN_KEYSTORE_PASSWORD" \
          | grep -E "SHA1:|SHA256:"
      env:
        HOZIN_KEYSTORE_BASE64: ${{ secrets.HOZIN_KEYSTORE_BASE64 }}
        HOZIN_KEYSTORE_PASSWORD: ${{ secrets.HOZIN_KEYSTORE_PASSWORD }}
        HOZIN_KEY_ALIAS: ${{ secrets.HOZIN_KEY_ALIAS }}

    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        HOZIN_KEYSTORE_PATH: /tmp/hozin-release.jks
        HOZIN_KEYSTORE_PASSWORD: ${{ secrets.HOZIN_KEYSTORE_PASSWORD }}
        HOZIN_KEY_ALIAS: ${{ secrets.HOZIN_KEY_ALIAS }}
        HOZIN_KEY_PASSWORD: ${{ secrets.HOZIN_KEY_PASSWORD }}

    - name: Siapkan APK rilis
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        cp "$APK" "$GITHUB_WORKSPACE/HozinNotes-${{ github.ref_name }}.apk"

    - name: Buat GitHub Release (hanya tag v*)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Hozin Notes ${{ github.ref_name }}
        body: |
          Hozin Notes v1.23
          Tanggal rilis: 23 Oktober 2026

          Isi rilis:
          - Riwayat revisi catatan: setiap suntingan tersimpan sebagai
            revisi, riwayat revisi bisa dibuka dari editor dan versi
            sebelumnya dapat dipulihkan.
          - Cari & ganti teks di dalam editor catatan.
          - Perbaikan internal: error compile (import NoteRevision &
            RevisionDao di NoteRepository) yang menggagalkan build
            v1.23 pertama sudah diperbaiki.

          Pemasangan: unduh HozinNotes-v1.23.apk dari halaman ini, lalu
          pasang di perangkat Android (minimum Android 8.0).

          Catatan: APK ini build release dari GitHub Actions,
          ditandatangani dengan keystore rilis proyek.
        files: ${{ github.workspace }}/HozinNotes-${{ github.ref_name }}.apk
