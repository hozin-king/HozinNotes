name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Siapkan keystore rilis (dari secrets)
      run: |
        echo "$HOZIN_KEYSTORE_BASE64" | base64 -d > /tmp/hozin-release.jks
        echo "== Fingerprint sertifikat rilis (daftarkan SHA-1 ke Google Cloud Console) =="
        keytool -list -v -keystore /tmp/hozin-release.jks \
          -alias "$HOZIN_KEY_ALIAS" -storepass "$HOZIN_KEYSTORE_PASSWORD" \
          | grep -E "SHA1:|SHA256:"
      env:
        HOZIN_KEYSTORE_BASE64: ${{ secrets.HOZIN_KEYSTORE_BASE64 }}
        HOZIN_KEYSTORE_PASSWORD: ${{ secrets.HOZIN_KEYSTORE_PASSWORD }}
        HOZIN_KEY_ALIAS: ${{ secrets.HOZIN_KEY_ALIAS }}

    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        HOZIN_KEYSTORE_PATH: /tmp/hozin-release.jks
        HOZIN_KEYSTORE_PASSWORD: ${{ secrets.HOZIN_KEYSTORE_PASSWORD }}
        HOZIN_KEY_ALIAS: ${{ secrets.HOZIN_KEY_ALIAS }}
        HOZIN_KEY_PASSWORD: ${{ secrets.HOZIN_KEY_PASSWORD }}

    - name: Verifikasi signature APK
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
        echo "APK: $APK"
        keytool -printcert -jarfile "$APK" | grep -E "SHA1|SHA256" \
          || echo "(fingerprint APK tidak terbaca via keytool — cek manual bila perlu)"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hozin-notes-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
